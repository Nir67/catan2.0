services:
  - type: web
    name: catan2-game
    runtime: node
    plan: free
    rootDir: catan-game
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
      - key: DATABASE_URL
        sync: false
